name: effortless-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: effortless-backend-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-effortless}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-effortless}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend-network

  redis:
    image: redis:7-alpine
    container_name: effortless-backend-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: effortless-backend-api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/effortless}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      CASHFREE_APP_ID: ${CASHFREE_APP_ID:-}
      CASHFREE_SECRET_KEY: ${CASHFREE_SECRET_KEY:-}
      CASHFREE_ENVIRONMENT: ${CASHFREE_ENVIRONMENT:-sandbox}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/app
    command:
      [
        "uvicorn",
        "main:app",
        "--app-dir",
        "src",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-network

networks:
  backend-network:
    name: effortless-backend-network

volumes:
  postgres_data:
    name: effortless_backend_postgres_data
  redis_data:
    name: effortless_backend_redis_data
