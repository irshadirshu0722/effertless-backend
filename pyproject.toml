[tool.poetry]
name = "effortless"
version = "0.1.0"
description = "AI-powered voice translation backend for the Effortless keyboard"
authors = ["Nandu Rajeev <nandurajeev3@gmail.com>"]
packages = [
    { include = "app", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
    # Web framework
    # Justification: Core framework providing async HTTP/WS, OpenAPI generation,
    # Pydantic integration, and dependency injection.
fastapi = ">=0.115.0"

    # ASGI server
    # Justification: Production ASGI server required to run FastAPI. Standard
    # extras include uvloop and httptools for performance.
uvicorn = { version = ">=0.30.0", extras = ["standard"] }

    # Configuration management
    # Justification: Type-safe environment variable loading with validation.
    # Required for the Settings pattern used in src/core/config.py.
 pydantic-settings = ">=2.4.0"

    # Sarvam AI SDK
    # Justification: Official Python SDK for Sarvam AI services (Saaras STT,
    # Mayura translation, Sarvam-Translate). Verified from PyPI and docs.sarvam.ai.
sarvamai = ">=0.1.0"

    # Async relational persistence
    # Justification: PostgreSQL-backed subscription state and SQLAlchemy's
    # async engine/session support.
sqlalchemy = { version = ">=2.0.0", extras = ["asyncio"] }
asyncpg = ">=0.29.0"

    # Async cache client
    # Justification: Low-latency Redis caching for frequently read subscription state.
redis = ">=5.0.0"

    # GCP Identity Platform token verification
    # Justification: Official Google/Firebase Admin SDK for server-side ID-token
    # verification, revocation checks, and disabled-user detection.
firebase-admin = "^7.7.0"

    # Admin dashboard interface
    # Justification: Out-of-the-box administrative panel for SQLAlchemy models and views.
sqladmin = ">=0.20.0"
itsdangerous = ">=2.1.0"

    # Async HTTP client
    # Justification: Async HTTP client for external integrations (Cashfree gateway, GCP Identity Platform).
httpx = ">=0.27.0"
celery = {extras = ["redis"], version = "^5.6.3"}

[tool.poetry.group.dev.dependencies]
    # Linter and formatter
    # Justification: Single tool for linting, formatting, and import sorting.
    # Replaces flake8 + black + isort with better performance.
ruff = ">=0.6.0"

    # Test framework
    # Justification: Standard Python test framework with superior fixture system.
pytest = ">=8.0.0"

    # Async test support
    # Justification: Required for testing async FastAPI handlers and use cases.
pytest-asyncio = ">=0.24.0"

    # Git hook runner for local quality checks
    # Justification: Runs the same Ruff checks before commits across developer machines.
pre-commit = ">=3.8.0"

    # Migration CLI
    # Justification: Versioned PostgreSQL schema migrations managed separately
    # from application startup.
alembic = ">=1.13.0"

    # Integration test containers
    # Justification: Spin up ephemeral real PostgreSQL and Redis Docker containers
    # for integration tests verifying database migrations, persistence, and Redis cache.
testcontainers = {version = ">=4.8.0", extras = ["postgres", "redis"]}


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for Depends())
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
